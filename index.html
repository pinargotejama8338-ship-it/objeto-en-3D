<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Brazo Robótico 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Cristal UI */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        /* Personalización de scrollbar para el panel */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body class="select-none">

    <!-- Canvas para Three.js -->
    <div id="canvas-container"></div>

    <!-- Panel de Control Principal -->
    <div class="absolute top-4 left-4 z-10 w-80 max-w-[calc(100vw-2rem)] glass-panel rounded-2xl p-5 shadow-2xl transition-all duration-300">
        <div class="flex items-center justify-between mb-3 border-b border-slate-700/60 pb-3">
            <h1 class="text-lg font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-robot text-amber-400"></i> Brazo Robótico 6-Ejes
            </h1>
            <span class="text-[10px] px-2 py-1 bg-amber-500/20 text-amber-300 rounded-full border border-amber-500/30 font-semibold">Simulación FK</span>
        </div>

        <div class="space-y-3 text-sm max-h-[78vh] overflow-y-auto pr-1 custom-scroll">
            
            <!-- Telemetría rápida -->
            <div class="grid grid-cols-2 gap-2 bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs">
                <div>
                    <span class="text-slate-400 block text-[10px] uppercase font-semibold">Estado Servos</span>
                    <span id="servo-status" class="font-mono text-emerald-400 font-bold">ACTIVO</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-[10px] uppercase font-semibold">Carga Garra</span>
                    <span id="gripper-status" class="font-mono text-amber-400 font-bold">ABIERTA</span>
                </div>
            </div>

            <!-- Controles de Articulaciones (Cinemática Directa) -->
            <div class="space-y-2 border-t border-slate-700/60 pt-2">
                <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider block">Articulaciones (Ejes)</span>
                
                <!-- Eje 1: Base Giratoria -->
                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-0.5">
                        <span>Eje 1 - Base (Y)</span>
                        <span id="j1-val" class="font-mono text-amber-400">0°</span>
                    </div>
                    <input type="range" id="j1-control" min="-180" max="180" value="0" step="1" class="w-full accent-amber-400 cursor-pointer">
                </div>

                <!-- Eje 2: Hombro -->
                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-0.5">
                        <span>Eje 2 - Hombro (Z)</span>
                        <span id="j2-val" class="font-mono text-amber-400">15°</span>
                    </div>
                    <input type="range" id="j2-control" min="-60" max="75" value="15" step="1" class="w-full accent-amber-400 cursor-pointer">
                </div>

                <!-- Eje 3: Codo -->
                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-0.5">
                        <span>Eje 3 - Codo (Z)</span>
                        <span id="j3-val" class="font-mono text-amber-400">-30°</span>
                    </div>
                    <input type="range" id="j3-control" min="-90" max="60" value="-30" step="1" class="w-full accent-amber-400 cursor-pointer">
                </div>

                <!-- Eje 4: Giro Antebrazo -->
                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-0.5">
                        <span>Eje 4 - Muñeca Giro (X)</span>
                        <span id="j4-val" class="font-mono text-amber-400">0°</span>
                    </div>
                    <input type="range" id="j4-control" min="-180" max="180" value="0" step="1" class="w-full accent-amber-400 cursor-pointer">
                </div>

                <!-- Eje 5: Inclinación Muñeca -->
                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-0.5">
                        <span>Eje 5 - Muñeca Tilt (Z)</span>
                        <span id="j5-val" class="font-mono text-amber-400">15°</span>
                    </div>
                    <input type="range" id="j5-control" min="-90" max="90" value="15" step="1" class="w-full accent-amber-400 cursor-pointer">
                </div>

                <!-- Eje 6: Apertura Garra -->
                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-0.5">
                        <span class="font-semibold text-amber-300">Garra / Effectuer</span>
                        <span id="claw-val" class="font-mono text-amber-400">0%</span>
                    </div>
                    <input type="range" id="claw-control" min="0" max="100" value="0" step="1" class="w-full accent-amber-400 cursor-pointer">
                </div>
            </div>

            <!-- Ajustes de Apariencia -->
            <div class="grid grid-cols-2 gap-3 border-t border-slate-700/60 pt-3">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Color Robot</label>
                    <div class="flex gap-2 items-center">
                        <input type="color" id="robot-color" value="#f59e0b" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0">
                        <span id="robot-color-val" class="text-[11px] font-mono text-slate-300">#f59e0b</span>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Luz LED</label>
                    <div class="flex gap-2 items-center">
                        <input type="color" id="led-color" value="#38bdf8" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0">
                        <span id="led-color-val" class="text-[11px] font-mono text-slate-300">#38bdf8</span>
                    </div>
                </div>
            </div>

            <!-- Opciones extra -->
            <div class="space-y-2 border-t border-slate-700/60 pt-2">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-400">Estructura Wireframe</label>
                    <input type="checkbox" id="wireframe-check" class="w-4 h-4 accent-amber-400 rounded cursor-pointer">
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-400">Auto Rotación Cámara</label>
                    <input type="checkbox" id="autorotate-check" class="w-4 h-4 accent-amber-400 rounded cursor-pointer">
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="pt-2 space-y-2">
                <button id="reset-pose-btn" class="w-full py-2 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 border border-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i> Restablecer Postura Home
                </button>
                <button id="reset-cube-btn" class="w-full py-2 bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500/40 text-amber-300 text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cube"></i> Restablecer Objeto de Prueba
                </button>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 glass-panel px-4 py-2 rounded-full text-xs text-slate-300 pointer-events-none flex items-center gap-3">
        <span><i class="fa-solid fa-hand-pointer text-amber-400"></i> Arrastra para rotar vista</span>
        <span class="text-slate-600">•</span>
        <span><i class="fa-solid fa-magnifying-glass text-amber-400"></i> Zoom rueda</span>
    </div>

    <script>
        // Variables globales Three.js
        let scene, camera, renderer, controls;
        
        // Nodos cinemáticos para el brazo
        let joint1Group, joint2Group, joint3Group, joint4Group, joint5Group;
        let leftFinger, rightFinger;
        let targetCube;

        // Listas para actualización de materiales
        let robotMaterials = [];
        let ledMaterials = [];
        let ledLightPoint;

        // Elementos UI
        const j1Control = document.getElementById('j1-control');
        const j2Control = document.getElementById('j2-control');
        const j3Control = document.getElementById('j3-control');
        const j4Control = document.getElementById('j4-control');
        const j5Control = document.getElementById('j5-control');
        const clawControl = document.getElementById('claw-control');

        const j1Val = document.getElementById('j1-val');
        const j2Val = document.getElementById('j2-val');
        const j3Val = document.getElementById('j3-val');
        const j4Val = document.getElementById('j4-val');
        const j5Val = document.getElementById('j5-val');
        const clawVal = document.getElementById('claw-val');

        const robotColorInput = document.getElementById('robot-color');
        const robotColorVal = document.getElementById('robot-color-val');
        const ledColorInput = document.getElementById('led-color');
        const ledColorVal = document.getElementById('led-color-val');

        const wireframeCheck = document.getElementById('wireframe-check');
        const autorotateCheck = document.getElementById('autorotate-check');
        const resetPoseBtn = document.getElementById('reset-pose-btn');
        const resetCubeBtn = document.getElementById('reset-cube-btn');
        const gripperStatus = document.getElementById('gripper-status');

        function init() {
            // 1. Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.02);

            // 2. Cámara
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4, 3, 5);

            // 3. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Controles de Cámara
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 1.2, 0);
            controls.maxPolarAngle = Math.PI / 2 + 0.02; // Evitar pasar por debajo del suelo

            // 5. Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(6, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 25;
            dirLight.shadow.camera.left = -5;
            dirLight.shadow.camera.right = 5;
            dirLight.shadow.camera.top = 5;
            dirLight.shadow.camera.bottom = -5;
            scene.add(dirLight);

            // Luz azul de ambiente industrial
            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.5);
            rimLight.position.set(-6, 2, -5);
            scene.add(rimLight);

            // 6. Entorno y Suelo
            const gridHelper = new THREE.GridHelper(20, 20, 0xf59e0b, 0x1e293b);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            const floorMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, metalness: 0.2 })
            );
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Crear Mesa de Pedestal para el Robot
            const pedestalMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.8, 0.9, 0.2, 32),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.7 })
            );
            pedestalMesh.position.y = 0.1;
            pedestalMesh.receiveShadow = true;
            pedestalMesh.castShadow = true;
            scene.add(pedestalMesh);

            // 7. Construir Brazo Robótico (Cinemática)
            buildRobotArm();

            // 8. Crear Objeto de Interacción (Cubo de prueba)
            buildInteractiveCube();

            // Setup Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupUIListeners();

            // Iniciar ciclo de animación
            animate();
        }

        function buildRobotArm() {
            // Materiales Principales
            const robotMat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b,
                roughness: 0.3,
                metalness: 0.6
            });
            robotMaterials.push(robotMat);

            const darkMetalMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                roughness: 0.4,
                metalness: 0.8
            });

            const chromeMat = new THREE.MeshStandardMaterial({
                color: 0xe2e8f0,
                roughness: 0.1,
                metalness: 0.9
            });

            const ledMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                emissive: 0x38bdf8,
                emissiveIntensity: 1.5,
                roughness: 0.1
            });
            ledMaterials.push(ledMat);

            // --- BASE FJA Y EJE 1 (Base Giratoria) ---
            joint1Group = new THREE.Group();
            joint1Group.position.set(0, 0.2, 0); // Encima del pedestal
            scene.add(joint1Group);

            // Motor Base (Cilindro giratorio)
            const baseRotator = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.7, 0.3, 32),
                darkMetalMat
            );
            baseRotator.position.y = 0.15;
            baseRotator.castShadow = true;
            joint1Group.add(baseRotator);

            // Anillo LED indicativo
            const ledRing = new THREE.Mesh(
                new THREE.TorusGeometry(0.61, 0.02, 16, 32),
                ledMat
            );
            ledRing.rotation.x = Math.PI / 2;
            ledRing.position.y = 0.28;
            joint1Group.add(ledRing);

            // Soporte del Hombro
            const shoulderBracket = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 0.5, 0.5),
                robotMat
            );
            shoulderBracket.position.y = 0.55;
            shoulderBracket.castShadow = true;
            joint1Group.add(shoulderBracket);

            // Eje de pivote del hombro (Cilindro horizontal)
            const shoulderPivot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.18, 0.18, 0.6, 20),
                darkMetalMat
            );
            shoulderPivot.rotation.z = Math.PI / 2;
            shoulderPivot.position.y = 0.65;
            shoulderPivot.castShadow = true;
            joint1Group.add(shoulderPivot);

            // --- EJE 2 (Hombro) ---
            joint2Group = new THREE.Group();
            joint2Group.position.set(0, 0.65, 0);
            joint1Group.add(joint2Group);

            // Armazón del Brazo Principal
            const mainArmSegment = new THREE.Mesh(
                new THREE.BoxGeometry(0.24, 1.2, 0.28),
                robotMat
            );
            mainArmSegment.position.y = 0.6;
            mainArmSegment.castShadow = true;
            joint2Group.add(mainArmSegment);

            // Detalle hidráulico decorativo
            const piston = new THREE.Mesh(
                new THREE.CylinderGeometry(0.05, 0.05, 0.9, 16),
                chromeMat
            );
            piston.position.set(0.15, 0.5, 0);
            joint2Group.add(piston);

            // --- EJE 3 (Codo) ---
            joint3Group = new THREE.Group();
            joint3Group.position.set(0, 1.15, 0); // En el extremo del brazo principal
            joint2Group.add(joint3Group);

            // Pivote del Codo
            const elbowPivot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.15, 0.45, 20),
                darkMetalMat
            );
            elbowPivot.rotation.z = Math.PI / 2;
            elbowPivot.castShadow = true;
            joint3Group.add(elbowPivot);

            // Antebrazo Segmento 1
            const forearmSegment = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 0.9, 0.22),
                robotMat
            );
            forearmSegment.position.y = 0.45;
            forearmSegment.castShadow = true;
            joint3Group.add(forearmSegment);

            // --- EJE 4 (Rotación de Muñeca) ---
            joint4Group = new THREE.Group();
            joint4Group.position.set(0, 0.85, 0);
            joint3Group.add(joint4Group);

            // Anillo conector de muñeca
            const wristRotator = new THREE.Mesh(
                new THREE.CylinderGeometry(0.12, 0.12, 0.2, 20),
                darkMetalMat
            );
            wristRotator.position.y = 0.1;
            wristRotator.castShadow = true;
            joint4Group.add(wristRotator);

            // --- EJE 5 (Inclinación de Muñeca / Cabezal) ---
            joint5Group = new THREE.Group();
            joint5Group.position.set(0, 0.2, 0);
            joint4Group.add(joint5Group);

            const handBase = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.12, 0.2),
                darkMetalMat
            );
            handBase.position.y = 0.08;
            handBase.castShadow = true;
            joint5Group.add(handBase);

            // Luz LED en el punto del efector final
            const effectorLed = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 12, 12),
                ledMat
            );
            effectorLed.position.set(0, 0.12, 0.11);
            joint5Group.add(effectorLed);

            // Punto de luz spotlight desde el cabezal hacia abajo
            ledLightPoint = new THREE.PointLight(0x38bdf8, 1.5, 3);
            ledLightPoint.position.set(0, 0.15, 0.12);
            joint5Group.add(ledLightPoint);

            // --- GARRA / EFFECTOR FINAL (2 TENAZAS) ---
            const clawBaseY = 0.14;

            // Tenaza Izquierda
            leftFinger = new THREE.Group();
            leftFinger.position.set(-0.08, clawBaseY, 0);
            joint5Group.add(leftFinger);

            const f1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.06), chromeMat);
            f1.position.set(0, 0.1, 0);
            f1.castShadow = true;
            leftFinger.add(f1);

            const f1Tip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 0.05), darkMetalMat);
            f1Tip.position.set(0.03, 0.2, 0);
            f1Tip.rotation.z = -Math.PI / 6;
            f1Tip.castShadow = true;
            leftFinger.add(f1Tip);

            // Tenaza Derecha
            rightFinger = new THREE.Group();
            rightFinger.position.set(0.08, clawBaseY, 0);
            joint5Group.add(rightFinger);

            const f2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.06), chromeMat);
            f2.position.set(0, 0.1, 0);
            f2.castShadow = true;
            rightFinger.add(f2);

            const f2Tip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 0.05), darkMetalMat);
            f2Tip.position.set(-0.03, 0.2, 0);
            f2Tip.rotation.z = Math.PI / 6;
            f2Tip.castShadow = true;
            rightFinger.add(f2Tip);
        }

        // Crear un objeto de prueba (Cubo) sobre la mesa
        function buildInteractiveCube() {
            const cubeGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
            const cubeMat = new THREE.MeshStandardMaterial({
                color: 0xef4444,
                roughness: 0.3,
                metalness: 0.2
            });
            targetCube = new THREE.Mesh(cubeGeo, cubeMat);
            targetCube.position.set(0.8, 0.325, 0.6);
            targetCube.castShadow = true;
            targetCube.receiveShadow = true;
            scene.add(targetCube);
        }

        function setupUIListeners() {
            // Actualización de ángulos según sliders
            j1Control.addEventListener('input', (e) => {
                const deg = e.target.value;
                j1Val.textContent = `${deg}°`;
                joint1Group.rotation.y = THREE.MathUtils.degToRad(deg);
            });

            j2Control.addEventListener('input', (e) => {
                const deg = e.target.value;
                j2Val.textContent = `${deg}°`;
                joint2Group.rotation.z = THREE.MathUtils.degToRad(deg);
            });

            j3Control.addEventListener('input', (e) => {
                const deg = e.target.value;
                j3Val.textContent = `${deg}°`;
                joint3Group.rotation.z = THREE.MathUtils.degToRad(deg);
            });

            j4Control.addEventListener('input', (e) => {
                const deg = e.target.value;
                j4Val.textContent = `${deg}°`;
                joint4Group.rotation.y = THREE.MathUtils.degToRad(deg);
            });

            j5Control.addEventListener('input', (e) => {
                const deg = e.target.value;
                j5Val.textContent = `${deg}°`;
                joint5Group.rotation.z = THREE.MathUtils.degToRad(deg);
            });

            // Apertura / Cierre de la Garra
            clawControl.addEventListener('input', (e) => {
                const val = e.target.value; // 0 (abierta) a 100 (cerrada)
                clawVal.textContent = `${val}%`;

                // Traslación horizontal de las tenazas
                const offset = (val / 100) * 0.05;
                leftFinger.position.x = -0.08 + offset;
                rightFinger.position.x = 0.08 - offset;

                if (val > 70) {
                    gripperStatus.textContent = "CERRADA";
                    gripperStatus.className = "font-mono text-emerald-400 font-bold";
                } else {
                    gripperStatus.textContent = "ABIERTA";
                    gripperStatus.className = "font-mono text-amber-400 font-bold";
                }
            });

            // Cambios de color
            robotColorInput.addEventListener('input', (e) => {
                const color = e.target.value;
                robotColorVal.textContent = color;
                robotMaterials.forEach(m => m.color.set(color));
            });

            ledColorInput.addEventListener('input', (e) => {
                const color = e.target.value;
                ledColorVal.textContent = color;
                ledMaterials.forEach(m => {
                    m.color.set(color);
                    m.emissive.set(color);
                });
                if (ledLightPoint) ledLightPoint.color.set(color);
            });

            // Opción Wireframe
            wireframeCheck.addEventListener('change', (e) => {
                const isWireframe = e.target.checked;
                robotMaterials.forEach(m => m.wireframe = isWireframe);
            });

            // Auto-rotación
            autorotateCheck.addEventListener('change', (e) => {
                controls.autoRotate = e.target.checked;
                controls.autoRotateSpeed = 1.5;
            });

            // Resetear Posición de Inicio
            resetPoseBtn.addEventListener('click', () => {
                j1Control.value = 0;
                j2Control.value = 15;
                j3Control.value = -30;
                j4Control.value = 0;
                j5Control.value = 15;
                clawControl.value = 0;

                j1Val.textContent = "0°";
                j2Val.textContent = "15°";
                j3Val.textContent = "-30°";
                j4Val.textContent = "0°";
                j5Val.textContent = "15°";
                clawVal.textContent = "0%";

                joint1Group.rotation.y = THREE.MathUtils.degToRad(0);
                joint2Group.rotation.z = THREE.MathUtils.degToRad(15);
                joint3Group.rotation.z = THREE.MathUtils.degToRad(-30);
                joint4Group.rotation.y = THREE.MathUtils.degToRad(0);
                joint5Group.rotation.z = THREE.MathUtils.degToRad(15);

                leftFinger.position.x = -0.08;
                rightFinger.position.x = 0.08;
                gripperStatus.textContent = "ABIERTA";
                gripperStatus.className = "font-mono text-amber-400 font-bold";
            });

            // Resetear Cubo
            resetCubeBtn.addEventListener('click', () => {
                targetCube.position.set(0.8, 0.325, 0.6);
                targetCube.rotation.set(0, 0, 0);
            });

            // Aplicar posiciones iniciales
            joint1Group.rotation.y = THREE.MathUtils.degToRad(0);
            joint2Group.rotation.z = THREE.MathUtils.degToRad(15);
            joint3Group.rotation.z = THREE.MathUtils.degToRad(-30);
            joint4Group.rotation.y = THREE.MathUtils.degToRad(0);
            joint5Group.rotation.z = THREE.MathUtils.degToRad(15);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            // Efecto de pulso en las luces LED
            const timeSec = (time || 0) * 0.002;
            const pulse = (Math.sin(timeSec * 3) + 1) * 0.2 + 0.8;
            ledMaterials.forEach(m => m.emissiveIntensity = pulse * 1.5);

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
